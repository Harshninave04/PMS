services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: medistra-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      # replicaSet=rs0 is required: admission create/transfer use MongoDB transactions
      - MONGODB_URI=mongodb://mongodb:27017/medistra-hms?replicaSet=rs0
      - NEXTAUTH_URL=http://localhost:3000
      - NEXTAUTH_SECRET=medistra_super_secret_production_jwt_key_2026_hms
      - DEFAULT_ADMIN_EMAIL=admin@hospital.com
      - DEFAULT_ADMIN_PASSWORD=password123
      - PORT=3000
      - HOSTNAME=0.0.0.0
    volumes:
      - uploads-data:/app/uploads
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - medistra-network

  mongodb:
    image: mongo:7.0
    container_name: medistra-mongodb
    restart: unless-stopped
    # Single-node replica set (needed for transactions).
    command: ["--replSet", "rs0", "--bind_ip_all"]
    environment:
      - MONGO_INITDB_DATABASE=medistra-hms
    volumes:
      - mongo-data:/data/db
    # No host port mapping on purpose. The app reaches this database over the
    # internal compose network as `mongodb:27017`. Publishing it also collides
    # with any other Mongo bound to the host port, and a host-side script that
    # connects to localhost:27017 can then silently write to the wrong
    # database. Use `docker exec medistra-mongodb mongosh medistra-hms` instead.
    healthcheck:
      # Initiates the replica set on first run, then reports healthy once it is PRIMARY.
      test: ["CMD", "mongosh", "--quiet", "--eval", "try { rs.status().ok } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'mongodb:27017'}]}).ok }"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 15s
    networks:
      medistra-network:
        aliases:
          - mongo
          - mongodb

  mongo-express:
    image: mongo-express:1.0.2
    container_name: medistra-mongo-express
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      - ME_CONFIG_MONGODB_URL=mongodb://mongodb:27017/?replicaSet=rs0
      - ME_CONFIG_MONGODB_SERVER=mongodb
      - ME_CONFIG_MONGODB_PORT=27017
      - ME_CONFIG_MONGODB_ENABLE_ADMIN=true
      - ME_CONFIG_BASICAUTH_USERNAME=admin
      - ME_CONFIG_BASICAUTH_PASSWORD=medistra
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - medistra-network

volumes:
  mongo-data:
    driver: local
  uploads-data:
    driver: local

networks:
  medistra-network:
    driver: bridge